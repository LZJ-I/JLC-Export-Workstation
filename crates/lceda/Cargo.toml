[package]
name = "lceda"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "嘉立创导出工作站 / JLC Export Workstation：搜索、3D、导出 Altium / KiCad / PADS"
keywords = ["lcsc", "altium", "kicad", "easyeda", "jlcpcb"]

[[bin]]
name = "lceda"
path = "src/main.rs"

[dependencies]
lceda-core.workspace = true
anyhow.workspace = true
clap.workspace = true
image.workspace = true
eframe = { version = "0.32", default-features = true }
egui = "0.32"
egui_extras = { version = "0.32", features = ["image"] }
egui_commonmark = { version = "0.21.1", default-features = false }
poll-promise = "0.3"
rfd = "0.15"
directories = "6"
webbrowser = "1"
serde_json.workspace = true
serde.workspace = true
calamine = "0.36"
csv = "1"
encoding_rs.workspace = true
ureq.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
ring = "0.17"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }

[build-dependencies]
winresource = "0.1"
