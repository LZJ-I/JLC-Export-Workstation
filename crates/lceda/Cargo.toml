[package]
name = "lceda"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JLC-Export：搜索、3D、Altium / KiCad / PADS 库导出"

[[bin]]
name = "lceda"
path = "src/main.rs"

[dependencies]
lceda-core.workspace = true
anyhow.workspace = true
clap.workspace = true
image.workspace = true
eframe = { version = "0.32", default-features = true }
egui = "0.32"
egui_extras = { version = "0.32", features = ["image"] }
egui_commonmark = { version = "0.21.1", default-features = false }
poll-promise = "0.3"
rfd = "0.15"
directories = "6"
webbrowser = "1"
serde_json.workspace = true
ureq.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1"
