[workspace]
resolver = "2"
members = ["crates/lceda-core", "crates/lceda"]

[workspace.package]
version = "0.8.1"
edition = "2021"
license = "CC-BY-NC-4.0"
repository = "https://github.com/LZJ-I/JLC-Export-Workstation"
authors = ["LZJ-I"]

[workspace.dependencies]
lceda-core = { path = "crates/lceda-core" }
anyhow = "1"
cfb = "0.10"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tobj = "4"
ureq = { version = "2.12", features = ["json"] }
urlencoding = "2"

[profile.release]
strip = true
