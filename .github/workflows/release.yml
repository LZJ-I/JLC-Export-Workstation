name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # macos-13 已退役，Intel 包在 Apple Silicon runner 上交叉编译。
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev pkg-config
      - name: Test native target
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --workspace --locked --target ${{ matrix.target }}
      - name: Test Windows plugin protocol and installer
        if: runner.os == 'Windows'
        shell: powershell
        run: ./integrations/altium/plugin/tests/RunTests.ps1 -OutputDirectory "$env:RUNNER_TEMP\lceda-plugin-tests"
      - name: Build
        run: cargo build --release --locked -p lceda --target ${{ matrix.target }}
      - name: Package zip
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          target = os.environ["TARGET"]
          tag = os.environ["TAG"]
          import tomllib
          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match package {version}")
          notes = Path("docs/releases") / f"{tag}.md"
          if not notes.is_file():
              raise SystemExit(f"missing release notes: {notes}")
          exe = "lceda.exe" if "windows" in target else "lceda"
          src = Path("target") / target / "release" / exe
          if not src.is_file():
              raise SystemExit(f"missing {src}")
          out = Path("dist")
          out.mkdir(exist_ok=True)
          zpath = out / f"lceda-{tag}-{target}.zip"
          with ZipFile(zpath, "w", ZIP_DEFLATED) as z:
              info = ZipInfo(exe)
              info.compress_type = ZIP_DEFLATED
              info.external_attr = (0o755 if exe == "lceda" else 0o644) << 16
              z.writestr(info, src.read_bytes())
              lic = ZipInfo("LICENSE")
              lic.compress_type = ZIP_DEFLATED
              lic.external_attr = 0o644 << 16
              z.writestr(lic, Path("LICENSE").read_bytes())
              for document in [Path("README.md"), Path("README_ZH.md"), notes]:
                  z.write(document, document.name)
          print(zpath, zpath.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh dist
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/SHA256SUMS.txt \
            --verify-tag --title "${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
