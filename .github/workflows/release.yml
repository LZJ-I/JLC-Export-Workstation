name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # macos-13 已退役，Intel 包在 Apple Silicon runner 上交叉编译。
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev pkg-config
      - name: Build
        run: cargo build --release -p lceda --target ${{ matrix.target }}
      - name: Package zip
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          target = os.environ["TARGET"]
          tag = os.environ["TAG"]
          exe = "lceda.exe" if "windows" in target else "lceda"
          src = Path("target") / target / "release" / exe
          if not src.is_file():
              raise SystemExit(f"missing {src}")
          out = Path("dist")
          out.mkdir(exist_ok=True)
          zpath = out / f"lceda-{tag}-{target}.zip"
          with ZipFile(zpath, "w", ZIP_DEFLATED) as z:
              info = ZipInfo(exe)
              info.compress_type = ZIP_DEFLATED
              info.external_attr = (0o755 if exe == "lceda" else 0o644) << 16
              z.writestr(info, src.read_bytes())
              lic = ZipInfo("LICENSE")
              lic.compress_type = ZIP_DEFLATED
              lic.external_attr = 0o644 << 16
              z.writestr(lic, Path("LICENSE").read_bytes())
          print(zpath, zpath.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh dist
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "${GITHUB_REF_NAME}" \
            --notes "$(cat <<'EOF'
          ## 改进

          ### 名字
          - 窗口标题改为 **嘉立创导出工作站** / **JLC Export Workstation**（仓库仍叫 JLC-Export）。

          ### Altium 三栏
          - **Designator**：只用立创位号前缀（`U?` / `R?` / `CN?` / `SW?`），不再拿型号当位号。
          - **Comment**：型号或阻容值。
          - **Description**：设置里勾选字段、按住 ☰ 拖动排序；空字段自动跳过。
          - 预设：**库用**、**只要参数**、**只要编号**。
          - 立创商品规格按分号拆成多行写入 `COMPONENTDESCRIPTION`，中文 GBK。
          - KiCad Reference 跟着 Designator，不再按型号首字母猜。

          ### 界面
          - 导出设置拆成 **格式 / 原理图 / 简介** 三页。
          - 器件「详细信息」做成 AD 属性面板：常规三栏 + 编号 / 规格 / 其它，可搜索、在线查看、打开手册。
          - 开弹窗时遮罩底层，不能点底下、不能拖 3D、不能弹出照片放大镜。
          - 简介页可按型号或 C 编号查看指定器件的 AD 三栏预览。

          ### 设置会记住
          - 简介勾选和顺序、导出格式、3D 附带、封装改名、批量合并。
          - 原理图配色、自定义色、管脚字号。
          - 语言、主题、置顶、输出目录、窗口和分栏。
          - 设置页标签、导出二级页、侧栏展开、批量弹窗勾选。

          ### 原理图颜色
          - 立创官方方案：普通脚蓝字写入 PinTextData，对齐商城 SVG。
          - 管脚字号统一；自定义可调 6–16 pt，并可一键套用预设。

          ### 其它
          - README 补了立创EDA / LCSC / Altium / KiCad 检索说明，演示图换成操作录屏。

          ## 下载
          解压后运行：
          - Windows：`lceda.exe`
          - Linux / macOS：`lceda`
          EOF
          )"
